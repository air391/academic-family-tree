<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文学术语承谱系 · Chinese Academic Genealogy</title>
<style>
:root{--c0:#c0392b;--c1:#e67e22;--c2:#27ae60;--c3:#2980b9;--c4:#8e44ad;
--bg:#f7f6f3;--panel:#fff;--ink:#222;--mut:#888;--line:#e2ddd4;--acc:#8a1f1f;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;color:var(--acc)}
header .stats{font-size:12.5px;color:var(--mut)}
#search{padding:6px 10px;border:1px solid var(--line);border-radius:6px;width:220px;font-size:13px}
button.act{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12.5px;cursor:pointer;color:var(--acc)}
button.act:hover{background:#f6e8e5}
#legend{display:flex;gap:10px;font-size:12px;color:var(--mut);align-items:center}
#legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:3px;vertical-align:-1px}
main{flex:1;display:flex;min-height:0}
#sidebar{width:300px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:10px}
#sidebar h2{font-size:13px;color:var(--mut);margin:4px 2px 8px;position:sticky;top:0;background:var(--panel);z-index:1}
.titem{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1.5}
.titem:hover{background:#f0ece4}
.titem.active{background:#f6e8e5;outline:1px solid var(--acc)}
.titem b{color:var(--acc)}
.titem .meta{color:var(--mut);font-size:11.5px}
#canvaswrap{flex:1;position:relative;overflow:hidden;background:
 radial-gradient(circle,#e8e4db 1px,transparent 1px);background-size:22px 22px}
svg{width:100%;height:100%;cursor:grab}
.node{cursor:pointer}
.node circle.body{stroke:#fff;stroke-width:1.5px}
.node text{pointer-events:none}
.node .nm{font-size:12px;fill:var(--ink)}
.node .aff{font-size:10px;fill:var(--mut)}
.node.dim{opacity:.13}
.link{fill:none;stroke:#cbb;stroke-width:1.2px}
.link.dim{opacity:.08}
.link.hl{stroke:var(--acc);stroke-width:2px}
#panel{position:absolute;top:12px;right:12px;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.08);display:none;font-size:13px;max-height:calc(100% - 24px);overflow-y:auto}
#panel h3{font-size:15px;color:var(--acc);margin-bottom:6px}
#panel .kv{margin:5px 0;line-height:1.55}
#panel .k{color:var(--mut);font-size:11.5px}
#panel a.pl{cursor:pointer;text-decoration:underline dotted}
.hbadge{display:inline-block;background:linear-gradient(135deg,#b8860b,#d4a017);color:#fff;font-size:10.5px;border-radius:8px;padding:1px 7px;margin-left:5px;vertical-align:1px}
#hint{position:absolute;bottom:10px;left:12px;font-size:11px;color:var(--mut);background:rgba(255,255,255,.85);padding:4px 8px;border-radius:6px}
</style>
</head>
<body>
<header>
<h1>中文学术语承谱系 <span style="font-size:12px;color:var(--mut);font-weight:normal">Chinese Academic Genealogy · 公开数据 · 增量构建中</span></h1>
<span class="stats" id="hstats"></span>
<span class="stats" id="livestats"></span>
<input id="search" placeholder="搜索学者姓名，回车跳转…">
<button class="act" id="wander" title="随机打开一棵谱系树">🎲 随机逛树</button>
<span id="legend">
<i style="background:var(--c0)"></i>第0代
<i style="background:var(--c1)"></i>第1代
<i style="background:var(--c2)"></i>第2代
<i style="background:var(--c3)"></i>第3代
<i style="background:var(--c4)"></i>第4代
｜ <span title="金色徽章=两院院士/将军">🏅=院士/将军</span>
</span>
</header>
<main>
<div id="sidebar"><h2 id="trees-h"></h2><div id="treelist"></div></div>
<div id="canvaswrap">
<svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="viewport"></g></svg>
<div id="panel"></div>
<div id="hint">滚轮缩放 · 拖拽平移 · 点击节点看师承 · 点人名跳转漫游 · 🎲随机逛树</div>
</div>
</main>
<script>
const NODES = %NODES%;
const EDGES = %EDGES%;
const GEN = ['#c0392b','#e67e22','#27ae60','#2980b9','#8e44ad'];
const HONOR_KW = ['院士','少将','中将'];
const SRC_LABEL = {thu_etds:'高校学位论文库', wikidata:'WikiData', csv_import:'CSV 导入', oai_pmh:'机构库 OAI'};

// ---------- 图数据结构 ----------
const adjS = NODES.map(()=>[]);   // 学生
const adjA = NODES.map(()=>[]);   // 导师
EDGES.forEach(([a,s])=>{ adjS[a].push(s); adjA[s].push(a); });

// 代际：无导师=0，否则 max(导师代际)+1（多父取最深，DFS+记忆化，防环）
const gen = new Array(NODES.length).fill(-1);
function calcGen(i, stack){
  if(gen[i]>=0) return gen[i];
  if(stack.has(i)) return 0;
  stack.add(i);
  let g = 0;
  for(const a of adjA[i]) g = Math.max(g, calcGen(a, stack)+1);
  stack.delete(i);
  return gen[i] = g;
}
NODES.forEach((_,i)=>calcGen(i,new Set()));

// 连通分量（并查集）
const uf = NODES.map((_,i)=>i);
const find = x => { while(uf[x]!==x){ uf[x]=uf[uf[x]]; x=uf[x]; } return x; };
EDGES.forEach(([a,s])=>{ uf[find(a)] = find(s); });
const comps = new Map();
NODES.forEach((_,i)=>{ const r=find(i); if(!comps.has(r)) comps.set(r,[]); comps.get(r).push(i); });
const compList = [...comps.values()].map(members=>{
  const roots = members.filter(i=>!adjA[i].length);
  const rootDisp = roots.map(i=>NODES[i].n).sort();
  return { members, size: members.length,
    roots: rootDisp,
    display: rootDisp.slice(0,2).join('、') + (rootDisp.length>2?` 等${rootDisp.length}位`:''),
    maxGen: Math.max(...members.map(i=>gen[i])) };
}).sort((a,b)=>b.size-a.size);

// 组件归属索引
const compOf = new Array(NODES.length);
compList.forEach((c,ci)=>c.members.forEach(i=>compOf[i]=ci));

// ---------- 头部统计 ----------
const srcc = {};
NODES.forEach(n=>{ const s=n.s||'其他'; srcc[s]=(srcc[s]||0)+1; });
const srcTxt = Object.entries(srcc).map(([k,v])=>`${SRC_LABEL[k]||k} ${v} 人`).join(' · ');
document.getElementById('hstats').textContent =
  `${compList.length} 棵谱系树 · ${NODES.length} 位学者 · ${EDGES.length} 条师承边 · ${srcTxt}`;
document.getElementById('trees-h').textContent = compList.length + ' 棵谱系树（按规模排序）';

// ---------- 布局：整分量渲染（DAG，节点只出现一次） ----------
let curComp = 0, focusNode = -1;
let transform = {x:60,y:40,k:1};

function layout(ci){
  const members = new Set(compList[ci].members);
  // 分层：每层按"先到先排"排序，同名聚合，避免交叉
  const layers = [];
  const inLayer = new Map();
  compList[ci].members.forEach(i=>{
    const g = gen[i];
    while(layers.length<=g) layers.push([]);
    inLayer.set(i, layers[g].length);
    layers[g].push(i);
  });
  // 简单重心对齐：按导师平均位置排序两代（导师在自己层已排好）
  for(let pass=0; pass<2; pass++){
    for(let g=1; g<layers.length; g++){
      const key = i => {
        const ads = adjA[i].filter(a=>members.has(a));
        if(!ads.length) return inLayer.get(i);
        return ads.reduce((s,a)=>s+inLayer.get(a),0)/ads.length;
      };
      layers[g].sort((x,y)=>key(x)-key(y));
      layers[g].forEach((i,k)=>inLayer.set(i,k));
    }
  }
  const pos = new Map();
  const LH = 52, X0 = 40;
  layers.forEach((ly,g)=>{
    const total = ly.length*LH;
    ly.forEach((i,k)=>pos.set(i,{x:X0+g*210, y:30+k*LH + (ly.length<8?0:0), ly:k, n:ly.length, total}));
  });
  return pos;
}

function render(){
  const pos = layout(curComp);
  const vp = document.getElementById('viewport');
  vp.innerHTML='';
  // 祖先/后代高亮集合
  let anc=new Set(), desc=new Set();
  if(focusNode>=0){
    const q=[focusNode]; anc.add(focusNode);
    while(q.length){ const u=q.pop(); for(const a of adjA[u]) if(!anc.has(a)){anc.add(a);q.push(a);} }
    const q2=[focusNode]; desc.add(focusNode);
    while(q2.length){ const u=q2.pop(); for(const s of adjS[u]) if(!desc.has(s)){desc.add(s);q2.push(s);} }
  }
  // 边
  const link=document.createElementNS('http://www.w3.org/2000/svg','g');
  EDGES.forEach(([a,s])=>{
    if(!pos.has(a)||!pos.has(s)) return;
    const p1=pos.get(a), p2=pos.get(s);
    const l=document.createElementNS('http://www.w3.org/2000/svg','path');
    l.setAttribute('class','link'
      + (focusNode>=0 ? (anc.has(a)&&anc.has(s)||desc.has(a)&&desc.has(s) ? ' hl':' dim') : ''));
    l.setAttribute('d',`M${p1.x+14},${p1.y} C${p1.x+75},${p1.y} ${p2.x-75},${p2.y} ${p2.x-14},${p2.y}`);
    link.appendChild(l);
  });
  vp.appendChild(link);
  // 节点
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  pos.forEach((p,i)=>{
    const grp=document.createElementNS('http://www.w3.org/2000/svg','g');
    grp.setAttribute('class','node'+(focusNode>=0 && !anc.has(i) && !desc.has(i) ? ' dim':''));
    grp.setAttribute('transform',`translate(${p.x},${p.y})`);
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('class','body'); c.setAttribute('r',13); c.setAttribute('fill',GEN[gen[i]%5]);
    grp.appendChild(c);
    if(NODES[i].h && HONOR_KW.some(k=>NODES[i].h.includes(k))){
      const b=document.createElementNS('http://www.w3.org/2000/svg','circle');
      b.setAttribute('cx',10); b.setAttribute('cy',-10); b.setAttribute('r',6.5);
      b.setAttribute('fill','#d4a017'); b.setAttribute('stroke','#fff');
      grp.appendChild(b);
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',10); t.setAttribute('y',-6.5); t.setAttribute('text-anchor','middle');
      t.setAttribute('style','font-size:9.5px;fill:#fff;font-weight:bold'); t.textContent='院';
      grp.appendChild(t);
    }
    const t1=document.createElementNS('http://www.w3.org/2000/svg','text');
    t1.setAttribute('x',19); t1.setAttribute('y',-1);
    t1.setAttribute('class','nm'); t1.textContent=NODES[i].n.split('@')[0];
    grp.appendChild(t1);
    const aff = NODES[i].af || NODES[i].t || '';
    if(aff){
      const t2=document.createElementNS('http://www.w3.org/2000/svg','text');
      t2.setAttribute('x',19); t2.setAttribute('y',11);
      t2.setAttribute('class','aff'); t2.textContent=aff.length>16?aff.slice(0,16)+'…':aff;
      grp.appendChild(t2);
    }
    grp.addEventListener('click',ev=>{ ev.stopPropagation(); focusNode=i; showPanel(i); render(); });
    g.appendChild(grp);
  });
  vp.appendChild(g);
  apply();
  // 聚焦居中
  if(focusNode>=0 && pos.has(focusNode)){
    const p=pos.get(focusNode);
    transform.x = 200 - p.x*transform.k;
    transform.y = 180 - p.y*transform.k;
    apply();
  }
}

function apply(){
  document.getElementById('viewport').setAttribute('transform',
    `translate(${transform.x},${transform.y}) scale(${transform.k})`);
}

// ---------- 人物信息面板 ----------
function showPanel(i){
  const n=NODES[i], p=document.getElementById('panel');
  p.style.display='block';
  const ads = adjA[i].map(a=>`<a class="pl" data-i="${a}">${NODES[a].n}</a>`);
  const stus = adjS[i].map(s=>`<a class="pl" data-i="${s}">${NODES[s].n}</a>`);
  p.innerHTML = `<h3>${n.n.split('@')[0]}
    ${n.h&&HONOR_KW.some(k=>n.h.includes(k))?'<span class="hbadge">'+('院士'+(n.h.includes('将')?'·将军':''))+'</span>':''}</h3>
    <div class="kv"><span class="k">谱系角色：</span>第 ${gen[i]} 代</div>
    ${n.t?`<div class="kv"><span class="k">身份：</span>${n.t}</div>`:''}
    ${n.af?`<div class="kv"><span class="k">单位/职务：</span>${n.af}</div>`:''}
    ${n.h?`<div class="kv"><span class="k">荣誉/备注：</span>${n.h}</div>`:''}
    <div class="kv"><span class="k">导师（${ads.length}）：</span>${ads.length?ads.join('、'):'— 谱系起点'}</div>
    <div class="kv"><span class="k">学生（${stus.length}）：</span>${stus.length?stus.slice(0,12).join('、')+(stus.length>12?'…':''):'— 暂无记录'}</div>
    ${n.s?`<div class="kv"><span class="k">来源：</span>${SRC_LABEL[n.s]||n.s}</div>`:''}
    <div class="kv" style="color:#bbb;font-size:11px">点击导师/学生名字可跳转到其谱系位置</div>`;
  p.querySelectorAll('a.pl').forEach(a=>a.onclick=()=>{
    const j=+a.dataset.i;
    jumpTo(j);
  });
}

// 跳转：换分量（若需要）+聚焦
function jumpTo(i){
  const ci=compOf[i];
  if(ci!==curComp){ curComp=ci; focusNode=i; syncSidebar(); }
  focusNode=i; render(); showPanel(i);
}

// ---------- 侧栏 ----------
const tl=document.getElementById('treelist');
function syncSidebar(){
  tl.innerHTML='';
  compList.forEach((c,ci)=>{
    const d=document.createElement('div');
    d.className='titem'+(ci===curComp?' active':'');
    d.innerHTML=`<b>${c.display}</b>　${c.size}人 · ${c.maxGen+1}代<br>
    <span class="meta">根：${c.roots.slice(0,3).join('、')}${c.roots.length>3?'…':''}</span>`;
    d.onclick=()=>{ curComp=ci; focusNode=-1; document.getElementById('panel').style.display='none'; syncSidebar(); render(); };
    tl.appendChild(d);
  });
}
syncSidebar();

// ---------- 搜索：即时跳转（输入即找，回车同效） ----------
let searchTimer=null;
document.getElementById('search').addEventListener('input',e=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    const q=e.target.value.trim();
    if(!q) return;
    const hit = NODES.findIndex(n=>n.n.includes(q));
    if(hit>=0) jumpTo(hit);
  },350);
});
document.getElementById('search').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    clearTimeout(searchTimer);
    const q=e.target.value.trim();
    const hit = NODES.findIndex(n=>n.n.includes(q));
    if(hit>=0) jumpTo(hit);
  }
});

// ---------- 随机逛树 ----------
document.getElementById('wander').onclick=()=>{
  const ci = Math.floor(Math.random()*compList.length);
  const c = compList[ci];
  const i = c.members[Math.floor(Math.random()*c.members.length)];
  jumpTo(i);
};

// ---------- 缩放/平移 ----------
const svg=document.getElementById('svg');
let drag=null;
svg.addEventListener('wheel',e=>{ e.preventDefault();
  const f=e.deltaY<0?1.12:0.89; transform.k=Math.min(3,Math.max(.2,transform.k*f)); apply(); },{passive:false});
svg.addEventListener('mousedown',e=>{ drag={x:e.clientX,y:e.clientY}; svg.style.cursor='grabbing'; });
window.addEventListener('mousemove',e=>{ if(drag){ transform.x+=e.clientX-drag.x; transform.y+=e.clientY-drag.y; drag={x:e.clientX,y:e.clientY}; apply(); }});
window.addEventListener('mouseup',()=>{ drag=null; svg.style.cursor='grab'; });
svg.addEventListener('click',()=>{ focusNode=-1; render(); document.getElementById('panel').style.display='none'; });

// ---------- 云端实时查询（只读 token；留空则仅用本地快照）=====
const RO_TOKEN = "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicm8iLCJleHAiOjE3OTQ1ODAxODcsImlhdCI6MTc5MTk4ODE4NywiaWQiOiIwMWExM2E3Yi00NDAxLTdkNzItYWQyMS1mZjFkMjY5ZWExMjkiLCJraWQiOiJaSEtWbGNzcmQzeE50UDJ1WGc1UDVXSUdxRzk3Vm5wVGE5TnJNNGF6S2RzIiwicmlkIjoiOWNiNTYxNWItN2VlZC00ZDcyLThkM2EtYzcyNmJhNzI2YTlhIn0.TrqyIIJv6xgYRP3822DxwGDsVcO2RuswxPfXsTyTu1NoD4LI73wTDxK2--VUHkPuKJEEZz0HlH2XGmo3GE0rCg"; // 只读，2026-11-13 到期
const DB_HTTP = "https://academic-family-tree-zhott6oco.aws-ap-northeast-1.turso.io";
const liveEl = document.getElementById('livestats');
if(RO_TOKEN){ liveEl.textContent='· 云端实时查询：已连接（只读）'; liveEl.style.color='#27ae60'; }
else { liveEl.textContent='· 云端实时查询：未配置，仅显示最近快照'; }

async function tursoQuery(sql){
  const r = await fetch(DB_HTTP+"/v2/pipeline",{method:"POST",
    headers:{"Authorization":"Bearer "+RO_TOKEN,"Content-Type":"application/json"},
    body:JSON.stringify({requests:[{type:"execute",stmt:{sql}},{type:"close"}]})});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json();
  const res = j.results && j.results[0] && j.results[0].response;
  if(!res || res.type!=='execute') throw new Error('查询失败');
  return (res.result.rows||[]).map(row=>row.map(c=>c.value));
}

// 面板上追加云端学术简历（毕业院校/任教经历，来自 affiliations 表）
async function enrichCloud(i){
  if(!RO_TOKEN) return;
  const n=NODES[i];
  try{
    const rows = await tursoQuery(
      `SELECT i.name, a.role, a.detail FROM affiliations a JOIN institutions i ON i.id=a.institution_id
       WHERE a.person_id='${n.id.replace(/'/g,"''")}'`);
    if(rows.length){
      const p=document.getElementById('panel');
      const div=document.createElement('div');
      div.className='kv';
      div.innerHTML=`<span class="k">学术简历（云端实时）：</span>`+
        rows.map(r=>`${r[0]}（${r[1]}${r[2]?'·'+r[2]:''}）`).join('；');
      p.appendChild(div);
    }
  }catch(e){/* 静默降级 */}
}
const _showPanel = showPanel;
showPanel = function(i){ _showPanel(i); enrichCloud(i); };

// 深链接：#p=姓名 直接定位（可分享"某人的谱系页"链接）
function applyHash(){
  const m = location.hash.match(/p=([^&]+)/);
  if(m){
    const i = NODES.findIndex(n=>n.n.includes(decodeURIComponent(m[1])));
    if(i>=0){ jumpTo(i); return; }
  }
  render();
}
window.addEventListener('hashchange', applyHash);
applyHash();
</script>
</body>
</html>
